// ===== 멀티플레이 (다른 접속자 보기) =====
const MP=(()=>{
 const q=new URLSearchParams(location.search);
 const url=q.get('ws')||window.WS_URL||((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 const VER='v3';
 const R=new Map();let ws=null,myId=null,tries=0,opened=false,lastSent='',acc=0;
 const stat=document.createElement('div');stat.id='mps';stat.textContent='⚪ 오프라인 · '+VER;document.body.appendChild(stat);
 const rd=v=>Math.round(v*1000)/1000;
 const info=()=>({x:rd(me.g.position.x),z:rd(me.g.position.z),ry:rd(me.g.rotation.y),m:me.mode,sy:me.sitY??.07,n:myName,c:{g:cz.g,h:cz.h,o:cz.o}});
 const mkOpts=c=>({kind:'kid',g:c.g,hat:c.h,outfit:c.o,skin:'#fbd3bd',hair:'#2a2420'});
 const book=g=>{const b=new THREE.Mesh(new THREE.BoxGeometry(.3,.2,.04),M('#6aa5e8'));b.position.set(0,.68,.3);b.rotation.x=.9;b.visible=false;g.add(b);return b};
 function stat2(){stat.textContent='🟢 '+(R.size+1)+'명 접속 중 · '+VER}
 function apply(p,d){if(d.n&&p.tag&&d.n!==p.nm){p.nm=d.n;setName(p.tag,d.n)}p.tx=d.x;p.tz=d.z;p.try=d.ry;p.mode=d.m;p.sy=d.sy;
  const cs=JSON.stringify(d.c);
  if(cs!==p.cs){p.cs=cs;const g0=p.g,pos=g0.position.clone(),ry=g0.rotation.y;S.remove(g0);Object.assign(p,person(mkOpts(d.c)));p.mode=d.m;p.g.rotation.order='YXZ';p.g.position.copy(pos);p.g.rotation.y=ry;p.book=book(p.g)}}
 function add(d){let p=R.get(d.id);
  if(!p){p=person(mkOpts(d.c||{g:'f',h:'none',o:'basic'}));p.g.rotation.order='YXZ';p.g.position.set(d.x,0,d.z);p.g.rotation.y=d.ry||0;p.cs=JSON.stringify(d.c||{});p.book=book(p.g);
   p.nm=d.n;p.tag=mkTag(p,d.n||('친구'+d.id),false);R.set(d.id,p)}
  apply(p,d);stat2();return p}
 function rem(id){const p=R.get(id);if(!p)return;S.remove(p.g);if(p.tag){p.tag.e.remove();const i=bs.indexOf(p.tag);if(i>=0)bs.splice(i,1)}R.delete(id);stat2()}
 function connect(){try{ws=new WebSocket(url)}catch(e){retry();return}
  ws.onopen=()=>{opened=true;tries=0;lastSent='';stat2()};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
   if(m.t==='hello'){myId=m.id;m.players.forEach(add)}
   else if(m.t==='u'&&m.id!==myId)add(m)
   else if(m.t==='s'){const p=R.get(m.id);if(p)say(p,m.s,m.ms)}
   else if(m.t==='bye')rem(m.id)};
  ws.onclose=()=>{[...R.keys()].forEach(rem);stat.textContent='⚪ 오프라인 · '+VER;retry()};
  ws.onerror=()=>{}}
 function retry(){tries++;if(!opened&&tries>3)return;setTimeout(connect,Math.min(30000,1500*tries))}
 window.MPsay=(txt,ms)=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'s',s:txt,ms}))};
 function tick(dt){
  acc+=dt;if(acc>=.1){acc=0;if(ws&&ws.readyState===1){const i=info(),s=JSON.stringify(i);if(s!==lastSent){ws.send(JSON.stringify(Object.assign({t:'u'},i)));lastSent=s}}}
  R.forEach(p=>{const g=p.g,k=Math.min(1,dt*10);
   g.position.x+=(p.tx-g.position.x)*k;g.position.z+=(p.tz-g.position.z)*k;
   let da=p.try-g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));g.rotation.y+=da*Math.min(1,dt*12);
   const m=p.mode;g.position.y=m==='lie'?.8:(m==='sit'||m==='read')?(p.sy??.07):m==='walk'?Math.abs(Math.sin(T*10))*.05:0;
   g.rotation.x=m==='lie'?-Math.PI/2:0;if(p.book)p.book.visible=m==='read';pose(p,T)})}
 connect();return{tick,R}})();
// 루프
function pose(p,t){[p.armL,p.armR,p.legL,p.legR].forEach(a=>a.rotation.set(0,0,0));const m=p.mode;
 if(m=='walk'){const s=Math.sin(t*10);p.legL.rotation.x=s*.7;p.legR.rotation.x=-s*.7;p.armL.rotation.x=-s*.6;p.armR.rotation.x=s*.6}
 else if(m=='sit'||m=='read'){p.legL.rotation.x=p.legR.rotation.x=-Math.PI/2;if(m=='read')p.armL.rotation.x=p.armR.rotation.x=-1.15}
 else if(m=='wave')p.armR.rotation.z=2.5+Math.sin(t*12)*.3;
 else if(m=='steth')p.armR.rotation.x=-1.4+Math.sin(t*3)*.1;
 else if(m=='xr'){p.armL.rotation.z=-2.7;p.armR.rotation.z=2.7}
 else if(m=='eat')p.armR.rotation.x=-2.3+Math.sin(t*8)*.15;
 else if(m=='hug'){p.armL.rotation.x=p.armR.rotation.x=-1.15}
 else if(m=='shot')p.armR.rotation.z=1.4}
let last=performance.now(),T=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
 const hv=dpadMove(dt);if(!hv&&path.length){const tg=path[0],p=me.g.position,dx=tg.x-p.x,dz=tg.z-p.z,d=Math.hypot(dx,dz),st=3*dt;
  let da=Math.atan2(dx,dz)-me.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));me.g.rotation.y+=da*Math.min(1,dt*14);
  if(d<=st){p.x=tg.x;p.z=tg.z;path.shift();if(!path.length){me.mode='idle';if(pr){const r=pr;pr=null;r(true)}}}else{p.x+=dx/d*st;p.z+=dz/d*st}}
 me.g.position.y=me.mode=='lie'?.8:(me.mode=='sit'||me.mode=='read')?(me.sitY??.07):me.mode=='walk'?Math.abs(Math.sin(T*10))*.05:0;
 [me,man,doc,nu1,nu2,rad].forEach(p=>pose(p,T));MP.tick(dt);ANIM.tick(dt);nu1.g.scale.y=1.35+Math.sin(T*2+2)*.01;nu2.g.scale.y=1.35+Math.sin(T*2+3)*.01;man.g.scale.y=1.35+Math.sin(T*2)*.01;doc.g.scale.y=1.35+Math.sin(T*2+1)*.01;
 me.g.rotation.x=me.mode=='lie'?-Math.PI/2:0;book.visible=me.mode=='read';
 const c=me.g.position,D=9*zoom,d=D*Math.cos(camP),h=D*Math.sin(camP);
 cam.position.lerp(new THREE.Vector3(c.x+Math.sin(camA)*d,h,c.z+Math.cos(camA)*d),.1);cam.lookAt(c.x,.5,c.z);
 bs.forEach(o=>{const v=o.p.g.position.clone();v.y+=o.p.h;v.project(cam);o.e.style.transform=`translate(-50%,-100%) translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight-4}px)`});
 R.render(S,cam)}
setNight(night);requestAnimationFrame(loop);
setTimeout(()=>say(man,'어서 오세요~ 😊',3000),600);
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
